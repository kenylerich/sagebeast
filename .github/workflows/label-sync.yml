name: Label sync

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/issue-management/sync-labels.mjs
      - .github/workflows/label-sync.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Upsert labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/sync-labels.mjs
